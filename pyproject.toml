[project]
name = "pendant"
version = "0.1.0"
description = "Tools for communicating with Limitless Pendant BLE device"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "sdelcore" }
]
keywords = ["bluetooth", "ble", "pendant", "limitless", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "bleak>=3.0.0",
    "protobuf>=4.0.0",
    "opuslib>=3.0.0",
    "dbus-python>=1.3.0; sys_platform == 'linux'",
    "PyGObject>=3.44.0; sys_platform == 'linux'",
    "pynacl>=1.5.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
pendant = "pendant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pendant"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pendant",
    "proto/pendant.proto",
    "proto/pendant_pb2.py",
]
